<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGROMAN — бронирование PlayStation, Степногорск</title>
<meta name="description" content="Концепт сайта бронирования PlayStation-клуба IGROMAN: живая схема клуба, бронь с предоплатой, админка. Автор — Владимир Черкашин.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0d0b}
a{color:#ffc93c}a:hover{color:#ffe08a}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffc93c;outline-offset:2px}
</style>

<style>#concept{margin:0 auto 24px;width:max-content;max-width:90vw;padding:8px 12px;border-radius:10px;background:#201d15;border:1px solid #3a3426;color:#c9c1ab;font:700 12px Manrope,sans-serif}#concept a{color:#ffc93c}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Manrope, system-ui, sans-serif; color: #f6f1e3; background: #0e0d0b; min-height: 100vh; position: relative; overflow: hidden">

  <!-- фон: символы PlayStation, еле видно -->
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 900px; opacity: .06; pointer-events: none" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="#ffc93c" stroke-width="10">
      <circle cx="1180" cy="170" r="90"></circle>
      <path d="M140 640 l90 -150 l90 150 z"></path>
      <rect x="980" y="560" width="160" height="160" rx="6"></rect>
      <path d="M260 120 l120 120 M380 120 l-120 120"></path>
    </g>
  </svg>

  <!-- шапка -->
  <header style="position: relative; max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; justify-content: space-between">
    <a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #f6f1e3">
      <span style="width: 44px; height: 44px; border-radius: 12px; border: 2px dashed #6b6352; display: grid; place-items: center; font: 700 10px Manrope; color: #a39b86; text-align: center; line-height: 1.1">лого<br>клуба</span>
      <span style="font: 800 24px Unbounded, sans-serif; letter-spacing: .04em; color: #ffc93c">IGROMAN</span>
    </a>
    <nav aria-label="Разделы" style="display: flex; flex-wrap: wrap; gap: 6px">
      <a href="#map" style="padding: 10px 14px; border-radius: 10px; text-decoration: none; color: #d9d1bd; font: 700 15px Manrope">{{t.navMap}}</a>
      <a href="#prices" style="padding: 10px 14px; border-radius: 10px; text-decoration: none; color: #d9d1bd; font: 700 15px Manrope">{{t.navPrices}}</a>
      <a href="#bar" style="padding: 10px 14px; border-radius: 10px; text-decoration: none; color: #d9d1bd; font: 700 15px Manrope">{{t.navBar}}</a>
      <a href="#rent" style="padding: 10px 14px; border-radius: 10px; text-decoration: none; color: #d9d1bd; font: 700 15px Manrope">{{t.navRent}}</a>
      <a href="#rules" style="padding: 10px 14px; border-radius: 10px; text-decoration: none; color: #d9d1bd; font: 700 15px Manrope">{{t.navRules}}</a>
    </nav>
    <div role="group" aria-label="Язык" style="display: flex; border: 1px solid #3a3426; border-radius: 12px; padding: 4px; gap: 4px">
      <button onClick="{{ setRu }}" aria-pressed="{{ ruOn }}" style="{{ ruStyle }}">RU</button>
      <button onClick="{{ setKz }}" aria-pressed="{{ kzOn }}" style="{{ kzStyle }}">KZ</button>
    </div>
  </header>

  <!-- первый экран -->
  <section id="top" style="position: relative; max-width: 1280px; margin: 0 auto; padding: 40px 24px 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
    <div style="flex: 1 1 560px; min-width: 0">
      <p style="margin: 0 0 14px; font: 800 14px Manrope; letter-spacing: .18em; color: #ffc93c">{{t.kicker}}</p>
      <h1 style="margin: 0; font: 800 clamp(40px, 6vw, 76px)/1.02 Unbounded, sans-serif; letter-spacing: -.02em; white-space: pre-line">{{t.hero}}</h1>
      <p style="margin: 20px 0 0; max-width: 560px; font: 600 19px/1.5 Manrope; color: #c9c1ab">{{t.heroSub}}</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px">
      <div style="padding: 18px 22px; border-radius: 18px; background: #17150f; border: 1px solid #2e2a1f; min-width: 150px">
        <div style="font: 800 30px Unbounded; color: #ffc93c">{{freeCount}} / 8</div>
        <div style="font: 700 14px Manrope; color: #a39b86; margin-top: 6px">{{t.freeNow}}</div>
      </div>
      <div style="padding: 18px 22px; border-radius: 18px; background: #17150f; border: 1px solid #2e2a1f; min-width: 150px">
        <div style="font: 800 30px Unbounded">14:00–03:00</div>
        <div style="font: 700 14px Manrope; color: #a39b86; margin-top: 6px">{{t.hours}}</div>
      </div>
    </div>
  </section>

  <!-- часы работы: сразу на виду -->
  <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 0 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 16px 20px; border-radius: 18px; background: #241f12; border: 1px solid #5a4a1c">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffc93c" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font: 800 16px Manrope; color: #ffe08a">{{t.info1}}</span>
      <span style="font: 600 15px/1.45 Manrope; color: #c9c1ab; flex: 1 1 320px">{{t.info2}}</span>
    </div>
  </div>

  <!-- схема + бронь -->
  <section id="map" style="position: relative; max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <div style="flex: 999 1 640px; min-width: 0; background: #17150f; border: 1px solid #2e2a1f; border-radius: 24px; padding: 22px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px">
        <h2 style="margin: 0; font: 800 26px Unbounded">{{t.mapTitle}}</h2>
        <ul aria-label="Обозначения" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 14px; font: 700 13px Manrope; color: #c9c1ab">
          <li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #ffc93c"></span>{{t.lgFree}}</li>
          <li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; border: 2px solid #ffc93c"></span>{{t.lgLater}}</li>
          <li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #3b1d1e; border: 2px solid #e5484d"></span>{{t.lgBusy}}</li>
          <li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #2b2820"></span>{{t.lgOff}}</li>
          <li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 18px; height: 6px; border-radius: 3px; background: #8fd18b"></span>{{t.lgDoor}}</li>
        </ul>
      </div>
      <div ref="{{ setMapBox }}" style="{{ mapOuter }}">
        <div style="{{ mapInner }}">
          <!-- стены и зоны (схема Вована, вариант 3) -->
          <div style="position: absolute; left: 0px; top: 0px; width: 476px; height: 133px; border: 3px solid #5a5240; border-radius: 8px; background: #1c1a13; box-sizing: border-box"></div>
          <div style="position: absolute; left: 473px; top: 0px; width: 287px; height: 133px; border: 3px solid #5a5240; border-radius: 8px; background: #1c1a13; box-sizing: border-box"></div>
          <div style="position: absolute; left: 0px; top: 130px; width: 323px; height: 93px; border: 3px solid #5a5240; border-radius: 8px; background: #1c1a13; box-sizing: border-box"></div>
          <div style="position: absolute; left: 320px; top: 130px; width: 156px; height: 93px; border: 3px solid #5a5240; border-radius: 8px; background: #141209; box-sizing: border-box"></div>
          <div style="position: absolute; left: 473px; top: 130px; width: 287px; height: 93px; border: 3px solid #5a5240; border-radius: 8px; background: #141209; box-sizing: border-box"></div>
          <div style="position: absolute; left: 757px; top: 130px; width: 94px; height: 93px; border: 3px solid #5a5240; border-radius: 8px; box-sizing: border-box; display: grid; place-items: center; font: 800 13px Manrope; color: #6b6352">WC</div>
          <div style="position: absolute; left: 320px; top: 220px; width: 531px; height: 423px; border: 3px solid #5a5240; border-radius: 10px; background: #1c1a13; box-sizing: border-box"></div>
          <div style="position: absolute; left: 320px; top: 640px; width: 203px; height: 123px; border: 3px solid #5a5240; border-radius: 8px; background: #1c1a13; box-sizing: border-box"></div>
          <div style="position: absolute; left: 520px; top: 640px; width: 331px; height: 123px; border: 3px solid #5a5240; border-radius: 8px; background: #17150f; box-sizing: border-box"></div>
          <div style="position: absolute; left: 330px; top: 196px; font: 700 10px Manrope; letter-spacing: .1em; color: #6b6352">{{t.lobby}}</div>
          <div style="position: absolute; left: 490px; top: 168px; font: 700 12px Manrope; letter-spacing: .14em; color: #6b6352">{{t.corridor}}</div>
          <div style="position: absolute; left: 520px; top: 236px; font: 800 13px Manrope; letter-spacing: .14em; color: #8a816b">{{t.hall}}</div>
          <div style="position: absolute; left: 617px; top: 712px; width: 150px; height: 40px; border-radius: 8px; background: #201d15; border: 1px solid #3a3426; display: grid; place-items: center; font: 700 13px Manrope; color: #a39b86">{{t.reception}}</div>
          <div style="position: absolute; left: 785px; top: 712px; width: 54px; height: 40px; border-radius: 6px; border: 1px dashed #5a1f22; display: grid; place-items: center; font: 700 9px/1.1 Manrope; color: #c98a8c; text-align: center; white-space: pre-line">{{t.fridge}}</div>
          <!-- двери -->
          <template data-sc="for" list="{{ doors }}" as="dr" hint-placeholder-count="9">
            <span aria-hidden="true" style="{{ dr.style }}"></span>
          </template>
          <div style="position: absolute; left: 862px; top: 676px; display: flex; align-items: center; gap: 8px; font: 800 13px Manrope; color: #ffc93c">
            <svg aria-hidden="true" width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="#ffc93c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9H4M10 3L4 9l6 6"></path></svg>{{t.entrance}}
          </div>
          <!-- станции -->
          <template data-sc="for" list="{{ stations }}" as="s" hint-placeholder-count="8">
            <button onClick="{{ s.pick }}" aria-label="{{ s.aria }}" aria-pressed="{{ s.selected }}" style="{{ s.style }}">
              <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%">
                <span style="font: 800 15px Unbounded">{{s.name}}</span>
                <span style="{{ s.badgeStyle }}">{{s.console}}</span>
              </span>
              <span style="font: 700 12px/1.25 Manrope; text-align: left; width: 100%; opacity: .92">{{s.statusText}}</span>
              <span style="font: 600 11px Manrope; text-align: left; width: 100%; opacity: .7">{{s.capText}}</span>
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- панель брони -->
    <aside aria-label="Бронирование" style="flex: 1 1 380px; min-width: 0; background: #17150f; border: 1px solid #2e2a1f; border-radius: 24px; padding: 24px">
      <template data-sc="if" value="{{ noSel }}" hint-placeholder-val="{{ false }}">
        <h2 style="margin: 0 0 10px; font: 800 24px Unbounded">{{t.pickTitle}}</h2>
        <p style="margin: 0; font: 600 16px/1.5 Manrope; color: #a39b86">{{t.pickSub}}</p>
      </template>

      <template data-sc="if" value="{{ stepForm }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <div>
            <p style="margin: 0; font: 800 12px Manrope; letter-spacing: .16em; color: #ffc93c">{{t.booking}}</p>
            <h2 style="margin: 6px 0 0; font: 800 26px Unbounded">{{sel.name}} · {{sel.console}}</h2>
            <p style="margin: 6px 0 0; font: 600 14px Manrope; color: #a39b86">{{sel.capText}}</p>
          </div>
        </div>
        <template data-sc="if" value="{{ sel.swapped }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: #241f12; border: 1px solid #5a4a1c; font: 700 14px/1.4 Manrope; color: #ffe08a">{{t.swapNote}}</p>
        </template>

        <h3 style="margin: 20px 0 8px; font: 800 14px Manrope; color: #c9c1ab">{{t.sched}}</h3>
        <div role="img" aria-label="{{ schedAria }}" style="position: relative; height: 26px; border-radius: 8px; background: #201d15; overflow: hidden">
          <template data-sc="for" list="{{ blocks }}" as="bl" hint-placeholder-count="2">
            <span style="{{ bl.style }}"></span>
          </template>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font: 700 11px Manrope; color: #8a816b"><span>14:00</span><span>18:00</span><span>22:00</span><span>02:00</span></div>

        <h3 style="margin: 22px 0 10px; font: 800 14px Manrope; color: #c9c1ab">{{t.date}}</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <template data-sc="for" list="{{ days }}" as="d" hint-placeholder-count="3">
            <button onClick="{{ d.pick }}" aria-pressed="{{ d.on }}" style="{{ d.style }}">{{d.label}}<span style="display: block; font: 600 11px Manrope; opacity: .75; margin-top: 2px">{{d.sub}}</span></button>
          </template>
        </div>

        <h3 style="margin: 20px 0 10px; font: 800 14px Manrope; color: #c9c1ab">{{t.time}}</h3>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <template data-sc="for" list="{{ times }}" as="tm" hint-placeholder-count="12">
            <button onClick="{{ tm.pick }}" disabled="{{ tm.disabled }}" aria-pressed="{{ tm.on }}" aria-label="{{ tm.aria }}" style="{{ tm.style }}">{{tm.label}}</button>
          </template>
        </div>

        <h3 style="margin: 20px 0 10px; font: 800 14px Manrope; color: #c9c1ab">{{t.duration}}</h3>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
          <template data-sc="for" list="{{ durs }}" as="du" hint-placeholder-count="9">
            <button onClick="{{ du.pick }}" aria-pressed="{{ du.on }}" style="{{ du.style }}">{{du.label}}</button>
          </template>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px">
          <div style="padding: 14px; border-radius: 16px; background: #201d15; border: 1px solid #2e2a1f">
            <div style="font: 800 13px Manrope; color: #c9c1ab">{{t.people}}</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px">
              <button onClick="{{ pplMinus }}" aria-label="{{ t.less }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a3426; background: #17150f; color: #f6f1e3; font: 800 22px Manrope">−</button>
              <span style="font: 800 26px Unbounded">{{people}}</span>
              <button onClick="{{ pplPlus }}" aria-label="{{ t.more }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a3426; background: #17150f; color: #f6f1e3; font: 800 22px Manrope">+</button>
            </div>
            <div style="font: 600 12px/1.35 Manrope; color: #a39b86; margin-top: 8px; min-height: 32px">{{pplHint}}</div>
          </div>
          <div style="padding: 14px; border-radius: 16px; background: #201d15; border: 1px solid #2e2a1f">
            <div style="font: 800 13px Manrope; color: #c9c1ab">{{t.joy}}</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px">
              <button onClick="{{ joyMinus }}" aria-label="{{ t.less }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a3426; background: #17150f; color: #f6f1e3; font: 800 22px Manrope">−</button>
              <span style="font: 800 26px Unbounded">{{joy}}</span>
              <button onClick="{{ joyPlus }}" aria-label="{{ t.more }}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a3426; background: #17150f; color: #f6f1e3; font: 800 22px Manrope">+</button>
            </div>
            <div style="font: 600 12px/1.35 Manrope; color: #a39b86; margin-top: 8px; min-height: 32px">{{t.joyHint}}</div>
          </div>
        </div>

        <div style="margin-top: 20px; padding: 16px 18px; border-radius: 16px; border: 1px dashed #4a4434">
          <template data-sc="for" list="{{ lines }}" as="ln" hint-placeholder-count="3">
            <div style="display: flex; justify-content: space-between; gap: 12px; font: 600 14px/1.9 Manrope; color: #c9c1ab"><span>{{ln.a}}</span><span style="color: #f6f1e3; font-weight: 800">{{ln.b}}</span></div>
          </template>
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 12px; border-top: 1px solid #2e2a1f">
            <span style="font: 800 16px Manrope">{{t.total}}</span>
            <span style="font: 800 30px Unbounded; color: #ffc93c">{{totalText}}</span>
          </div>
        </div>
        <label style="display: block; margin-top: 16px; font: 800 13px Manrope; color: #c9c1ab" for="ph">{{t.phone}}</label>
        <input id="ph" type="tel" placeholder="+7 7__ ___ __ __" style="margin-top: 8px; width: 100%; box-sizing: border-box; height: 50px; border-radius: 14px; border: 1px solid #3a3426; background: #0e0d0b; color: #f6f1e3; padding: 0 16px; font: 700 17px Manrope">
        <button onClick="{{ toPay }}" disabled="{{ noTime }}" style="{{ ctaStyle }}">{{ctaText}}</button>
      </template>

      <template data-sc="if" value="{{ stepPay }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font: 800 12px Manrope; letter-spacing: .16em; color: #ffc93c">{{t.payStep}}</p>
        <h2 style="margin: 6px 0 0; font: 800 26px Unbounded">{{t.prepay}}</h2>
        <div style="margin-top: 18px; padding: 20px; border-radius: 18px; background: #201d15; border: 1px solid #2e2a1f">
          <div style="display: flex; justify-content: space-between; font: 600 15px/2 Manrope; color: #c9c1ab"><span>{{t.total}}</span><span style="color: #f6f1e3; font-weight: 800">{{totalText}}</span></div>
          <div style="display: flex; justify-content: space-between; font: 600 15px/2 Manrope; color: #c9c1ab"><span>{{t.now50}}</span><span style="color: #ffc93c; font-weight: 800">{{halfText}}</span></div>
          <div style="display: flex; justify-content: space-between; font: 600 15px/2 Manrope; color: #c9c1ab"><span>{{t.onSite}}</span><span style="color: #f6f1e3; font-weight: 800">{{halfText}}</span></div>
        </div>
        <p style="margin: 14px 0 0; font: 600 14px/1.5 Manrope; color: #a39b86">{{t.payNote}}</p>
        <button onClick="{{ doPay }}" style="margin-top: 18px; width: 100%; height: 58px; border: 0; border-radius: 16px; background: #ffc93c; color: #1a1406; font: 800 17px Manrope">{{t.payKaspi}} · {{halfText}}</button>
        <button onClick="{{ back }}" style="margin-top: 10px; width: 100%; height: 48px; border: 1px solid #3a3426; border-radius: 14px; background: transparent; color: #d9d1bd; font: 700 15px Manrope">{{t.back}}</button>
      </template>

      <template data-sc="if" value="{{ stepDone }}" hint-placeholder-val="{{ false }}">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: #ffc93c; display: grid; place-items: center">
          <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1a1406" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </div>
        <h2 style="margin: 18px 0 0; font: 800 26px Unbounded">{{t.done}}</h2>
        <p style="margin: 10px 0 0; font: 600 16px/1.5 Manrope; color: #c9c1ab">{{doneText}}</p>
        <div style="margin-top: 18px; padding: 18px; border-radius: 18px; background: #201d15; border: 1px solid #2e2a1f; font: 700 15px/1.9 Manrope">
          <div style="display: flex; justify-content: space-between"><span style="color: #a39b86">{{t.code}}</span><span style="font: 800 18px Unbounded; color: #ffc93c">IG-2411-07</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #a39b86">{{t.paid}}</span><span>{{halfText}}</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #a39b86">{{t.onSite}}</span><span>{{halfText}}</span></div>
        </div>
        <p style="margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #5a1f22; background: #1e1112; font: 700 14px/1.45 Manrope; color: #f3b7b9">{{t.lateRule}}</p>
        <a href="admin.html" style="display: block; margin-top: 14px; text-align: center; padding: 14px; border-radius: 14px; border: 1px solid #3a3426; text-decoration: none; color: #ffc93c; font: 800 15px Manrope">{{t.seeAdmin}}</a>
        <button onClick="{{ reset }}" style="margin-top: 10px; width: 100%; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #d9d1bd; font: 700 15px Manrope; text-decoration: underline">{{t.again}}</button>
      </template>
    </aside>
  </section>

  <!-- цены -->
  <section id="prices" style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <h2 style="margin: 0; font: 800 40px Unbounded">{{t.navPrices}}</h2>
