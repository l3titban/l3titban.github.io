<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D</title><link rel="stylesheet" href="style.css"></head><body><script type="module">
import {THREE,setup,textTex,ui} from './common.js';
const P=new URLSearchParams(location.search); const ang=+(P.get('a')||-25), el=+(P.get('e')||8), tilt=+(P.get('t')||0), cut=P.get('cut')=='1', dist=+(P.get('d')||12);
const {r,scene,cam,live}=setup(); r.localClippingEnabled=true; const clip=cut?[new THREE.Plane(new THREE.Vector3(0,0,-1),0)]:[];
const g=new THREE.Group(); scene.add(g);
// body profile (tapered cup) radius bottom .78 top .92, height 3.0
const pts=[[0,0],[0.74,0],[0.78,0.04],[0.80,0.15],[0.92,2.75],[0.92,2.78]].map(p=>new THREE.Vector2(p[0],p[1]));
const white=new THREE.MeshPhysicalMaterial({color:0xf3f0ea,roughness:0.55,clearcoat:0.25,clearcoatRoughness:0.6,side:THREE.DoubleSide});
const body=new THREE.Mesh(new THREE.LatheGeometry(pts,128),white); body.castShadow=true; g.add(body);
// raised panel on front
const panelShape=new THREE.Shape(); const pw=0.55,ph=2.0,rr=0.25;
panelShape.moveTo(-pw/2+rr,-ph/2);panelShape.lineTo(pw/2-rr,-ph/2);panelShape.quadraticCurveTo(pw/2,-ph/2,pw/2,-ph/2+rr);panelShape.lineTo(pw/2,ph/2-rr);panelShape.quadraticCurveTo(pw/2,ph/2,pw/2-rr,ph/2);panelShape.lineTo(-pw/2+rr,ph/2);panelShape.quadraticCurveTo(-pw/2,ph/2,-pw/2,ph/2-rr);panelShape.lineTo(-pw/2,-ph/2+rr);panelShape.quadraticCurveTo(-pw/2,-ph/2,-pw/2+rr,-ph/2);
const pgeo=new THREE.ExtrudeGeometry(panelShape,{depth:0.02,bevelEnabled:true,bevelThickness:0.02,bevelSize:0.03,bevelSegments:4,curveSegments:24});
// text on panel
const tex=textTex('COFFEE',{font:'900 230px Arial',color:'#9b958d'});
const panel=new THREE.Mesh(pgeo,[new THREE.MeshPhysicalMaterial({color:0xf5f2ec,roughness:0.5}),white]); panel.position.set(0,1.45,0.86); panel.castShadow=true;
// bend: approximate by placing

const label=new THREE.Mesh(new THREE.PlaneGeometry(0.32,1.3),new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:0.6}));
label.position.set(0,1.3,0.905); g.add(label);
// steel ring
const steel=new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:0.18});
const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.935,0.935,0.18,128,1,true),steel); ring.position.y=2.86; g.add(ring);
// lid
const lidC=new THREE.MeshPhysicalMaterial({color:0xefe9e0,roughness:0.4,clearcoat:0.4});
const lid=new THREE.Mesh(new THREE.CylinderGeometry(0.88,0.94,0.42,128),lidC); lid.position.y=3.16; lid.castShadow=true; g.add(lid);
const top=new THREE.Mesh(new THREE.CylinderGeometry(0.80,0.88,0.06,128),lidC); top.position.y=3.40; g.add(top);
// flip tab
const tab=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,0.5,4,4,4),lidC); tab.position.set(0,3.5,0.35); tab.castShadow=true; g.add(tab);
const spout=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.12,0.1),new THREE.MeshStandardMaterial({color:0xd9d2c7,roughness:0.6})); spout.position.set(0,3.42,0.7); g.add(spout);

if(cut){
 [white,steel,lidC].forEach(m=>{m.clippingPlanes=clip; m.side=THREE.DoubleSide;});
 label.visible=false; tab.visible=false; spout.visible=false;
 // inner steel flask
 const ip=[[0,0.18],[0.64,0.18],[0.68,0.25],[0.80,2.75],[0.80,2.95]].map(p=>new THREE.Vector2(p[0],p[1]));
 const inner=new THREE.Mesh(new THREE.LatheGeometry(ip,128),new THREE.MeshStandardMaterial({color:0xcfd3d6,metalness:1,roughness:0.22,side:THREE.DoubleSide,clippingPlanes:clip}));
 g.add(inner);
 // cut faces: rings showing double wall (dark vacuum gap)
 const capMat=new THREE.MeshBasicMaterial({color:0xE8A659});
 // hot coffee
 const cf=new THREE.Mesh(new THREE.CylinderGeometry(0.76,0.66,2.2,96,1,false,Math.PI/2,Math.PI),new THREE.MeshStandardMaterial({color:0x5a3218,roughness:0.3,side:THREE.DoubleSide}));
 cf.position.y=1.38; g.add(cf);
 const cft=new THREE.Mesh(new THREE.CircleGeometry(0.76,96,Math.PI,Math.PI),new THREE.MeshStandardMaterial({color:0x7a4522,roughness:0.15})); cft.rotation.x=-Math.PI/2; cft.position.y=2.48; g.add(cft);
 // vacuum gap highlight strip on cut plane
 const gap=new THREE.Shape(); 
 const L=[[0.80,0.15],[0.92,2.75],[0.80,2.75],[0.68,0.25]];
 [1,-1].forEach(sgn=>{const sh=new THREE.Shape(); sh.moveTo(sgn*0.79,0.16); sh.lineTo(sgn*0.905,2.74); sh.lineTo(sgn*0.81,2.74); sh.lineTo(sgn*0.69,0.26); sh.closePath();
   const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:0xE8A659,side:THREE.DoubleSide})); m.position.z=0.002; g.add(m);});
}
g.rotation.y=THREE.MathUtils.degToRad(ang); g.rotation.z=THREE.MathUtils.degToRad(tilt);
const d=dist; cam.position.set(0, 1.8+d*Math.sin(THREE.MathUtils.degToRad(el)), d*Math.cos(THREE.MathUtils.degToRad(el))); cam.lookAt(0,1.75,0);

live([0, 1.5, 0]);ui([{"label": "Целиком", "q": "a=-25&d=13"}, {"label": "Разрез", "q": "cut=1&a=-25&d=13"}]);
</script></body></html>
