<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D</title><link rel="stylesheet" href="style.css"></head><body><script type="module">
import {THREE,setup,ui} from './common.js';
const P=new URLSearchParams(location.search); const ex=+(P.get('x')||0), ang=+(P.get('a')||-30), el=+(P.get('e')||18), d=+(P.get('d')||13);
const {r,scene,cam,ground,live}=setup(); ground.position.y=-0.02;
const g=new THREE.Group(); scene.add(g);
const rubber=new THREE.MeshPhysicalMaterial({color:0x151515,roughness:0.55,clearcoat:0.2,clearcoatRoughness:0.7});
const chrome=new THREE.MeshStandardMaterial({color:0xeeeeee,metalness:1,roughness:0.12});
const red=new THREE.MeshStandardMaterial({color:0xFF3D2E,roughness:0.6});
// bar along X
const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,4.0,48),chrome); bar.rotation.z=Math.PI/2; bar.castShadow=true; g.add(bar);
const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,1.3,48),new THREE.MeshStandardMaterial({color:0x1d1d1d,roughness:0.8})); grip.rotation.z=Math.PI/2; g.add(grip);
// thread texture rings
for(let i=0;i<26;i++){[1,-1].forEach(s=>{const t=new THREE.Mesh(new THREE.TorusGeometry(0.135,0.012,8,32),chrome); t.rotation.y=Math.PI/2; t.position.x=s*(0.75+i*0.048); g.add(t);});}
function plate(R,w){const gr=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(R,R,w,96),rubber); body.rotation.z=Math.PI/2; body.castShadow=true; gr.add(body);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,w+0.02,48),chrome); hub.rotation.z=Math.PI/2; gr.add(hub);
 [1,-1].forEach(s=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(R*0.72,0.025,12,96),new THREE.MeshPhysicalMaterial({color:0x0d0d0d,roughness:0.3,clearcoat:1})); ring.rotation.y=Math.PI/2; ring.position.x=s*w/2; gr.add(ring);});
 return gr;}
// plates per side: 2.5,2.5? set: 2.5kg(R1.0) 1.25(R.82) .5(R.6)
const spec=[[1.0,0.26],[1.0,0.26],[0.82,0.2],[0.6,0.16]];
[1,-1].forEach(s=>{let x=0.72;
  spec.forEach(([R,w],i)=>{const p=plate(R,w); x+=w/2; p.position.x=s*(x+ex*(i+1)*0.55); x+=w/2+0.01; g.add(p);});
  const nut=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.22,6),chrome); nut.rotation.z=Math.PI/2; nut.position.x=s*(x+0.12+ex*(spec.length+1)*0.55); nut.castShadow=true; g.add(nut);
});
g.position.y=1.02; g.rotation.y=THREE.MathUtils.degToRad(ang);
cam.position.set(0,1+d*Math.sin(THREE.MathUtils.degToRad(el)),d*Math.cos(THREE.MathUtils.degToRad(el))); cam.lookAt(0,1.0,0); cam.fov=30; cam.updateProjectionMatrix();
live([0, 1.0, 0]);ui([{"label": "Собрана", "q": "x=0&d=18"}, {"label": "Разобрана", "q": "x=1&d=27"}]);
</script></body></html>
