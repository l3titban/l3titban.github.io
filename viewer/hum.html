<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D</title><link rel="stylesheet" href="style.css"></head><body><script type="module">
import {THREE,setup,textTex,ui} from './common.js';
const P=new URLSearchParams(location.search); const cut=P.get('cut')=='1', ang=+(P.get('a')||-20), el=+(P.get('e')||10), d=+(P.get('d')||14);
const {r,scene,cam,live}=setup(); r.localClippingEnabled=true;
const clip=cut?[new THREE.Plane(new THREE.Vector3(0,0,-1),0)]:[];
const g=new THREE.Group(); scene.add(g);
const white=new THREE.MeshPhysicalMaterial({color:0xf4f6f7,roughness:0.35,clearcoat:0.5,side:THREE.DoubleSide,clippingPlanes:clip});
const tankM=new THREE.MeshPhysicalMaterial({color:0xf8fbfc,roughness:0.3,transparent:true,opacity:cut?1:0.97,side:THREE.DoubleSide,clippingPlanes:clip});
// base 0..1.3, tank 1.35..3.9, top cap
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.3,1.3,128),white); base.position.y=0.65; base.castShadow=true; g.add(base);
const seam=new THREE.Mesh(new THREE.CylinderGeometry(1.255,1.255,0.05,128),new THREE.MeshStandardMaterial({color:0xcfd6da,clippingPlanes:clip})); seam.position.y=1.32; g.add(seam);
const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.25,2.6,128,1,!cut),tankM); tank.position.y=2.65; tank.castShadow=true; g.add(tank);
const top=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.2,0.12,128),white); top.position.y=4.0; g.add(top);
const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,0.18,48),white); nozzle.position.y=4.12; g.add(nozzle);
// display ring on front of base
const disp=new THREE.Mesh(new THREE.CircleGeometry(0.34,64),new THREE.MeshStandardMaterial({color:0x111111,roughness:0.2}));disp.position.set(0,0.75,1.285);g.add(disp);
const ring=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.03,16,64),new THREE.MeshStandardMaterial({color:0xc9a35a,metalness:1,roughness:0.3}));ring.position.set(0,0.75,1.29);g.add(ring);
const lbl=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.22),new THREE.MeshBasicMaterial({map:textTex('FUTULA',{w:512,h:128,font:'bold 90px Arial',color:'#3a3a3a',rotate:false}),transparent:true}));lbl.position.set(0,1.18,1.272);g.add(lbl);
// water window on tank
const win=new THREE.Mesh(new THREE.PlaneGeometry(0.1,1.4),new THREE.MeshStandardMaterial({color:0x8a9aa3,transparent:true,opacity:0.5}));win.position.set(0,2.7,1.235);g.add(win);
if(cut){disp.visible=false;ring.visible=false;lbl.visible=false;win.visible=false;
 const water=new THREE.Mesh(new THREE.CylinderGeometry(1.12,1.16,1.8,96,1,false,Math.PI/2,Math.PI),new THREE.MeshPhysicalMaterial({color:0x6fc3ee,roughness:0.05,transparent:true,opacity:0.75,side:THREE.DoubleSide})); water.position.y=2.3;g.add(water);
 const wt=new THREE.Mesh(new THREE.CircleGeometry(1.12,96,Math.PI,Math.PI),new THREE.MeshPhysicalMaterial({color:0x9fdcff,roughness:0.02,transparent:true,opacity:0.8}));wt.rotation.x=-Math.PI/2;wt.position.y=3.2;g.add(wt);
 // ultrasonic plate in base
 const plate=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.08,48),new THREE.MeshStandardMaterial({color:0xd0d0d0,metalness:1,roughness:0.2}));plate.position.y=1.15;g.add(plate);
 const board=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,0.8),new THREE.MeshStandardMaterial({color:0x0f6b3a}));board.position.set(0,0.4,-0.2);g.add(board);
 const fan=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.15,32),new THREE.MeshStandardMaterial({color:0x333333}));fan.position.set(0.5,0.75,-0.3);g.add(fan);
 // mist tube
 const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,2.9,48,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.2,transparent:true,opacity:0.5,side:THREE.DoubleSide}));tube.position.y=2.7;g.add(tube);
}
// mist puffs
const mistM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.09,depthWrite:false});
for(let i=0;i<16;i++){const s=0.22+i*0.035;const m=new THREE.Mesh(new THREE.SphereGeometry(s,24,16),mistM);m.position.set(Math.sin(i*1.7)*0.12*i*0.15,4.4+i*0.13,Math.cos(i*1.3)*0.1);g.add(m);}
g.rotation.y=THREE.MathUtils.degToRad(ang);
cam.position.set(0,2.6+d*Math.sin(THREE.MathUtils.degToRad(el)),d*Math.cos(THREE.MathUtils.degToRad(el)));cam.lookAt(0,2.9,0);
live([0, 2.4, 0]);ui([{"label": "Целиком", "q": "a=-20&d=18"}, {"label": "Разрез", "q": "cut=1&a=-20&d=18"}]);
</script></body></html>
